data_cfg:
  dataset_name: SUSTech1K
  dataset_root: /path/to/SUSTech1K
  dataset_partition: /path/to/SUSTech1K_E.json
  num_workers: 8
  remove_no_gallery: false # Remove probe if no gallery for it
  test_dataset_name: SUSTech1K
  rgb_in_use: true

evaluator_cfg:
  enable_float16: true  
  restore_ckpt_strict: true
  restore_hint: 60000
  save_name: EventGait
  sampler:
    batch_shuffle: false
    batch_size: 8
    sample_type: evall_ordered # all indicates whole sequence used to test, while ordered means input sequence by its natural order; Other options:   fixed_unordered
    frames_all_limit: 720 # limit the number of sampled frames to prevent out of memory
    events_in_use: true # both event stream and event voxels in use
    rgb_in_use: true
    chunk_size: 6 # chunk size for evall testing
  metric: euc # cos
  transform:
    - type: Compose
      trf_cfg:
        - type: ReshapeHWC
          new_h: 64
          new_w: 64
        - type: HWC2CHW
        - type: NormalizeCHW
  evtransform:
    - type: Compose
      trf_cfg:
        - type: MergeST
        - type: ReshapeHWC
          new_h: 64
          new_w: 64
        - type: HWC2CHW
        - type: NormalizeCHW
  rgbtransform:
    - type: Compose
      trf_cfg:
        - type: HWC2CHW
        - type: BaseRgbTransform

loss_cfg:
  - loss_term_weight: 1.0   
    margin: 0.2             
    type: TripletLoss
    log_prefix: triplet     
  - loss_term_weight: 1.0   
    scale: 16
    type: CrossEntropyLoss  
    log_prefix: softmax
    log_accuracy: true
  - loss_term_weight: 0.2   
    type: MSELoss
    log_prefix: mse

model_cfg:
  model: EventGait
  pretrained_dinov2: 
    model_path: /path/to/dinov2_vits14_reg4_pretrain.pth
    num_register_tokens: 4
    image_size: 140
    feature_size: 16
    patch_size: 14
  backbone_cfg:
    static_branch: 
      type: SimpleResNet
      block: BasicBlock
      in_channel: 3
      channels: # Layers configuration for automatically model construction
        - 64
        - 128
      layers:
        - 1
        - 1
      strides:
        - 1
        - 2
      maxpool: true
    dynamic_branch: 
      type: MoESNN
      num_experts: 3
      out_channels:
        - 32
        - 64
        - 128
      strides:
        - 2
        - 2
        - 1
      v_threshold:
        - 0.5
        - 1.0
        - 1.5
  SeparateFCs:
    in_channels: 512
    out_channels: 256
    parts_num: 16
  SeparateBNNecks:
    class_num: 250   
    in_channels: 256
    parts_num: 16
  bin_num:
    - 16
  chunk_size: 6


optimizer_cfg:
  lr: 0.1
  momentum: 0.9
  solver: SGD
  weight_decay: 0.0005

scheduler_cfg:
  gamma: 0.1
  milestones: # Learning Rate Reduction at each milestones 2w 4w 5w
    - 20000
    - 40000
    - 50000
  scheduler: MultiStepLR

trainer_cfg:
  enable_float16: true # half_percesion float for memory reduction and speedup
  fix_BN: false
  with_test: false      
  log_iter: 100
  restore_ckpt_strict: true
  restore_hint: 0
  save_iter: 5000
  save_name: EventGait
  sync_BN: false
  total_iter: 60000
  sampler:
    batch_shuffle: true
    batch_size:
      - 8
      - 8
    frames_num_fixed: 30
    chunk_size: 6
    frames_num_max: 40 # max frames number for unfixed training
    frames_num_min: 20 # min frames number for unfixed traing
    frames_skip_num: 6
    events_in_use: true 
    rgb_in_use: true
    sample_type: evfixed_ordered # fixed control input frames number, unordered for controlling order of input tensor; Other options: unfixed_ordered or all_ordered
    type: TripletSampler
  transform:
    - type: Compose
      trf_cfg:
        - type: ReshapeHWC
          new_h: 64
          new_w: 64
        - type: HWC2CHW
        - type: NormalizeCHW
        - type: RandomRotate
          prob: 0.3
        - type: RandomErasing
          prob: 0.3
  evtransform:
    - type: Compose
      trf_cfg:
        - type: MergeST
        - type: ReshapeHWC
          new_h: 64
          new_w: 64
        - type: HWC2CHW
        - type: NormalizeCHW
  rgbtransform:
    - type: Compose
      trf_cfg:
        - type: HWC2CHW
        - type: BaseRgbTransform

